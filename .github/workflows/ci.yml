name: CI & Demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moacut
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: moacut_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moacut"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://moacut:ci-test-only@127.0.0.1:5432/moacut_test
      TEST_DATABASE_URL: postgresql+psycopg://moacut:ci-test-only@127.0.0.1:5432/moacut_test
      FACE_ANALYSIS_PROVIDER: fixture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: python scripts/check_harness.py
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: python -m pytest -q backend/tests
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run build:demo -- --base=/ZZIK/
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:demo
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: frontend/dist
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moacut
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: zzik_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moacut"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZZIK_E2E_DATABASE_URL: postgresql+psycopg://moacut:ci-test-only@127.0.0.1:5432/zzik_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/run_integration.py
      - name: Service logs on failure
        if: failure()
        run: |
          for log in logs/integration/*/*.log; do
            if [ -f "$log" ]; then
              tail -n 80 "$log"
            fi
          done
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: zzik-ci
      MOACUT_IMAGE_TAG: ci
      POSTGRES_PASSWORD: ci-test-only
      STORAGE_BACKEND: local
      FACE_ANALYSIS_PROVIDER: fixture
      DEMO_ENABLED: 'true'
      COOKIE_SECURE: 'false'
      ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start a clean full stack
        run: docker compose --env-file /dev/null up --build -d
      - name: Build AWS validation image and check inputs without network
        run: |
          bash scripts/aws_validation_container.sh build
          bash scripts/aws_validation_container.sh plan
          python - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path('data/aws-validation/reports').glob('*.json'))
          assert len(reports) == 1
          result = json.loads(reports[0].read_text())
          assert result['status'] == 'planned'
          assert result['dataset_kind'] == 'synthetic'
          assert result['plan']['photos'] == 2
          assert result['plan']['rekognition_calls_upper_bound'] == 7
          assert result['aws_requested'] is False and result['rekognition_calls'] == 0
          PY
      - name: Verify Nginx to API to PostgreSQL and seed
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 http://127.0.0.1:8080/api/health/ready
          docker compose --env-file /dev/null exec -T api python -m app.seed
      - run: npm --prefix frontend run test:e2e
      - name: Persist data across container restarts
        run: |
          python scripts/verify_restart.py setup --base-url http://127.0.0.1:8080
          docker compose --env-file /dev/null restart db api worker web
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 http://127.0.0.1:8080/api/health/ready
          python scripts/verify_restart.py verify --base-url http://127.0.0.1:8080
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file /dev/null logs --tail 100
      - name: Remove this runner's test stack
        if: always()
        run: docker compose --env-file /dev/null down --volumes --remove-orphans
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend, integration, compose]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
